name: Build and publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Pinned Ente CLI release. Bump this deliberately.
  # Tags live at https://github.com/ente-io/ente/releases (cli-v*)
  ENTE_RELEASE: cli-v0.2.3
  # sha256 of ente-cli-<ver>-linux-amd64.tar.gz. Leave empty to skip
  # verification - the build then prints the actual hash, so run it once
  # and paste the value here. See README.
  ENTE_SHA256: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint the backup script
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # severity=warning so stylistic notes don't block a build
          shellcheck --shell=sh --severity=warning ente-backup.sh

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped on pull requests - PRs from forks have no push credentials.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # QNAP x86 NAS units are amd64. To also publish arm64, add
          # linux/arm64 here - the build cross-compiles via Go, so it
          # does not need QEMU emulation.
          platforms: linux/amd64
          build-args: |
            ENTE_RELEASE=${{ env.ENTE_RELEASE }}
            ENTE_SHA256=${{ env.ENTE_SHA256 }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Testing $IMAGE"
          # The CLI must run...
          docker run --rm --entrypoint /usr/bin/ente "$IMAGE" help
          # ...and curl must actually execute, not just exist.
          # This is the check that would have caught the GLIBC breakage.
          docker run --rm --entrypoint curl "$IMAGE" --version
          # The wrapper must refuse to start unmonitored.
          if docker run --rm "$IMAGE"; then
            echo "ERROR: wrapper started without HC_URL set"
            exit 1
          fi
